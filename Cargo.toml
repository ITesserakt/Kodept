[package]
name = "kodept"
version = "0.2.3"
edition = "2021"
authors = ["Владимир Никитин <potyras85@mail.ru>"]
description = "Simple compiler with dependent types support in mind"
repository = "https://github.com/ITesserakt/Kodept/"
categories = ["compilers"]
license = "Apache-2.0"
rust-version = "1.76.0"

[workspace]
resolver = "2"
members = [
    "."
    , "crates/kodept-core"
    , "crates/kodept-parse"
    , "crates/kodept-inference"
    , "crates/kodept-ast"
    , "crates/kodept-report"
    , "crates/kodept-ir"
    , "crates/kodept-interning"
    , "crates/kodept-ast-nodes"
    , "crates/kodept-rlt"
    , "crates/kodept-frontend"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
bevy_ecs = { version = "0.15.1", default-features = false }
bevy_hierarchy = { version = "0.15.1", default-features = false }
thiserror = "2.0"
extend = "1.2"
itertools = "0.13"
nonempty-collections = "0.2.9"
tracing = "0.1.40"

[workspace.dependencies.derive_more]
version = "1.0.0"
features = ["display", "into", "from", "deref", "deref_mut", "constructor", "try_into", "is_variant", "unwrap"]

[workspace.lints]
clippy.suspicious = "deny"
clippy.correctness = "deny"
clippy.complexity = "warn"
clippy.style = "warn"
clippy.perf = "warn"
rust.unsafe_code = "deny"
rust.unreachable_pub = "warn"

[dependencies]
bevy_ecs.workspace = true
bevy_hierarchy.workspace = true
clap = { version = "4.5", features = ["derive", "env"] }
codespan-reporting = "0.11.1"
derive_more.workspace = true
memmap2 = { version = "0.9.5", features = ["stable_deref_trait"] }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.17", default-features = false, features = ["fmt", "ansi"] }
yoke = "0.7.4"

ctrlc = { version = "3.4.4", optional = true }
dhat = { version = "0.3", optional = true }
gag = { version = "1.0.0", optional = true }
rayon = { version = "1.10.0", optional = true }

kodept-core = { path = "crates/kodept-core" }
kodept-parse = { path = "crates/kodept-parse" }
kodept-ast = { path = "crates/kodept-ast" }
kodept-report = { path = "crates/kodept-report" }
kodept-ast-nodes = { path = "crates/kodept-ast-nodes" }
kodept-frontend = { path = "crates/kodept-frontend" }
kodept-rlt = { path = "crates/kodept-rlt" }

kodept-interning = { path = "crates/kodept-interning", optional = true }

[dev-dependencies]
tempfile = "3.7.0"
criterion = "0.5.1"

[features]
default = []
profiler = ["dep:dhat", "dep:ctrlc"]
parallel = ["dep:rayon", "kodept-parse/parallel", "kodept-ast/parallel", "bevy_ecs/multi_threaded"]
trace = ["dep:gag", "kodept-parse/trace"]
interning = ["dep:kodept-interning"]

[profile.profiler]
debug = true
lto = "thin"
strip = false
inherits = "release"

[profile.bench]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
panic = 'unwind'
strip = true

[profile.light]
inherits = "release"
opt-level = 2
lto = false

[profile.dev]
opt-level = 0
debug = true
panic = 'unwind'

[[bench]]
name = "ast_building"
harness = false
