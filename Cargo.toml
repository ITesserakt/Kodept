[package]
name = "kodept"
version = "0.2.3"
edition.workspace = true
rust-version.workspace = true
authors = ["Владимир Никитин <potyras85@mail.ru>"]
description = "Simple compiler with dependent types support in mind"
repository = "https://github.com/ITesserakt/Kodept/"
categories = ["compilers"]
license = "Apache-2.0"

[workspace]
resolver = "3"
members = [
    "."
    , "crates/kodept-core"
    , "crates/kodept-parse"
    , "crates/kodept-inference"
    , "crates/kodept-ast"
    , "crates/kodept-report"
    , "crates/kodept-ir"
    , "crates/kodept-interning"
    , "crates/kodept-ast-nodes"
    , "crates/kodept-rlt"
    , "crates/kodept-frontend"
    , "crates/kodept-interaction"]

[workspace.package]
edition = "2024"
rust-version = "1.88.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
bevy_ecs = { version = "0.17.1", default-features = false, features = ["std"] }
itertools = "0.14.0"
nonempty-collections = "1.0.1"
tracing = "0.1.40"

[workspace.dependencies.derive_more]
version = "2.0.1"
features = [
    "into", "from",
    "display", "error",
    "try_into", "try_from",
    "constructor"
]

[workspace.lints]
clippy.suspicious = "deny"
clippy.correctness = "deny"
clippy.complexity = "warn"
clippy.style = "warn"
clippy.perf = "warn"
rust.unsafe_code = "deny"
rust.unreachable_pub = "warn"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
derive_more.workspace = true
memmap2 = { version = "0.9.5", features = ["stable_deref_trait"] }
serde_json = "1"
tracing.workspace = true
tracing-subscriber = { version = "0.3.17", default-features = false, features = ["fmt", "ansi"] }
yoke = "0.8.0"

ctrlc = { version = "3.4.4", optional = true }
dhat = { version = "0.3", optional = true }
gag = { version = "1.0.0", optional = true }
rayon = { version = "1.10.0", optional = true }

kodept-ast = { path = "crates/kodept-ast" }
kodept-ast-nodes = { path = "crates/kodept-ast-nodes" }
kodept-core = { path = "crates/kodept-core" }
kodept-frontend = { path = "crates/kodept-frontend" }
kodept-interaction = { path = "crates/kodept-interaction" }
kodept-parse = { path = "crates/kodept-parse" }
kodept-report = { path = "crates/kodept-report" }
kodept-rlt = { path = "crates/kodept-rlt", features = ["serde"] }

kodept-interning = { path = "crates/kodept-interning", optional = true }

[dev-dependencies]
tempfile = "3.7.0"
criterion = "0.7.0"

[features]
default = []
profiler = ["dep:dhat", "dep:ctrlc"]
interning = ["dep:kodept-interning"]
parallel = ["dep:rayon", "kodept-parse/parallel", "kodept-ast/parallel", "kodept-ast-nodes/parallel", "kodept-interaction/parallel"]
trace = ["dep:gag", "kodept-parse/trace"]
interning = ["dep:kodept-interning"]
nom = ["kodept-parse/nom"]
debug = ["kodept-ast/debug"]

[profile.test.package.proptest]
opt-level = 3

[profile.test.package.rand_chacha]
opt-level = 3

[profile.profiler]
debug = true
lto = "thin"
strip = false
inherits = "release"

[profile.bench]
opt-level = 3
lto = false

[profile.release]
opt-level = 3
lto = "fat"
panic = 'unwind'
strip = true

[profile.light]
inherits = "release"
opt-level = 2
lto = false

[profile.dev]
opt-level = 0
debug = true
panic = 'unwind'
# kodept-parse produces *a lot* of debug info
split-debuginfo = "packed"

[[bench]]
name = "ast_building"
harness = false
