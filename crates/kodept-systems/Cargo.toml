[package]
name = "kodept-systems"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["dylib", "rlib"]

[dependencies]
bevy_ecs.workspace = true
derive_more.workspace = true
hashbrown = "0.16.1"
memmap2 = "0.9.8"
serde_json = "1.0.145"
tracing.workspace = true
yoke = "0.8.0"

kodept-ast = { path = "../kodept-ast", version = "0.7", features = ["debug"] }
kodept-ast-nodes = { path = "../kodept-ast-nodes", version = "0.2" }
kodept-core = { path = "../kodept-core", version = "0.4" }
kodept-frontend = { path = "../kodept-frontend", version = "0.2" }
kodept-parse = { path = "../kodept-parse", version = "0.4" }
kodept-report = { path = "../kodept-report", version = "0.2" }
kodept-report-macros = { path = "../kodept-report-macros", version = "0.1" }
kodept-rlt = { path = "../kodept-rlt", version = "0.2" }

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true

[features]
default = []
parallel = ["bevy_ecs/multi_threaded", "bevy_ecs/std"]
