[package]
name = "kodept-ast"
version = "0.7.5"
authors = ["Владимир Никитин <potyras85@mail.ru>"]
description = "Simple compiler with dependent types support in mind"
repository = "https://github.com/ITesserakt/Kodept/"
categories = ["compilers"]
license = "Apache-2.0"
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
parallel = ["dep:rayon", "kodept-ecs/parallel"]
debug = []
reflection = ["debug"]

[dependencies]
derive_more.workspace = true
smallvec = "1.15.1"
tracing.workspace = true

rayon = { version = "1.11", optional = true }

[dependencies.kodept-core]
path = "../kodept-core"
version = "0.4"

[dependencies.kodept-rlt]
path = "../kodept-rlt"
version = "0.2"

[dependencies.kodept-ecs]
path = "../kodept-ecs"
version = "0.1"
