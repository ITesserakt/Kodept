[package]
name = "kodept-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tracing.workspace = true
tracing-subscriber = "0.3"
rayon = "1.11"

kodept-frontend = { path = "../kodept-frontend", version = "0.2", features = ["parallel"] }
kodept-report = { path = "../kodept-report", version = "0.2" }

[lints]
workspace = true

[features]
default = []
