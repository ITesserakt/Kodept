[package]
name = "kodept-ast-nodes"
version = "0.2.6"
edition = "2021"
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
bevy_ecs.workspace = true
kodept-ast = { path = "../kodept-ast" }
kodept-rlt = { path = "../kodept-rlt" }

[dev-dependencies]
criterion = "0.7.0"
kodept-core = { version = "0.4", path = "../kodept-core" }
kodept-rlt = { version = "0.2", features = ["arbitrary"], path = "../kodept-rlt" }
proptest = "1.6.0"
serde_json = "1.0.145"
rayon = "1.11.0"

[features]
defalt = []
parallel = ["kodept-ast/parallel", "bevy_ecs/multi_threaded", "bevy_ecs/async_executor"]

[[bench]]
name = "ast_building"
harness = false
